<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozgar · Live demo</title>
<style>
:root{--accent:#2f4aa0;--bg:#f6f7f9;--panel:#fff;--text:#1a1d23;--muted:#5d6470;--line:#e2e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--panel:#1b1e23;--text:#e8eaed;--muted:#9aa1ab;--line:#2c3038}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.desc{color:var(--muted);margin:0 0 12px;min-height:1.5em}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.chrome{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.screen{position:relative;width:100%}
.screen img{display:block;width:100%;height:auto;user-select:none}
.hot{position:absolute;border:2px solid var(--accent);border-radius:8px;cursor:pointer;background:color-mix(in srgb,var(--accent) 12%,transparent);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.hot{animation:none}}
.hot.flash{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.cap{flex:1;min-width:200px}
.cap b{display:block}
.typed{display:inline-block;margin-top:4px;font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.nav button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nav button:disabled{opacity:.4;cursor:default}
.count{color:var(--muted);font-size:.9rem;min-width:4em;text-align:center}
.dots{display:flex;gap:6px;justify-content:center;padding:0 0 14px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line);cursor:pointer}
.dots span.on{background:var(--accent)}
video{display:block;width:100%;background:#000}
button:focus-visible,.hot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.85rem;margin-top:12px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Rozgar</h1>
  <p class="sub">Interactive walkthrough. Click the highlighted area, or use the arrow keys.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="desc" id="desc"></p>
  <div class="stage">
    <div class="chrome"><i></i><i></i><i></i></div>
    <div class="screen" id="screen"></div>
    <div class="bar">
      <div class="cap" id="cap"></div>
      <div class="nav">
        <button id="video" hidden>Watch video</button>
        <button id="prev">Back</button>
        <span class="count" id="count"></span>
        <button id="next" class="primary">Next</button>
      </div>
    </div>
    <div class="dots" id="dots"></div>
  </div>
  <p class="hint">Screenshots recorded from the running app.</p>
</main>
<script>
const FLOWS = [{"name": "First-run setup", "description": "Import your resume, add your details, pick an AI and run the first job search.", "frames": [{"src": "assets/first-run-setup-01.png", "caption": "Start by importing your LaTeX resume. Rozgar turns it into a pool of facts it may use", "typed": null, "hotspot": {"l": 35.625, "t": 37.95523218829516, "w": 15.148111979166668, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-02.png", "caption": "Every line of your resume is now an item in your content pool", "typed": null, "hotspot": {"l": 78.67838541666666, "t": 61.07466603053435, "w": 7.085503472222222, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-03.png", "caption": "Form answers come from your profile, never from the AI", "typed": null, "hotspot": {"l": 35.625, "t": 79.88629134860051, "w": 9.60666232638889, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-04.png", "caption": "Choose a local model with Ollama, so nothing leaves your computer", "typed": null, "hotspot": {"l": 35.625, "t": 62.175970101781175, "w": 9.28927951388889, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-05.png", "caption": "Pick a folder for Tracker.xlsx, the spreadsheet of everything you apply to", "typed": null, "hotspot": {"l": 35.625, "t": 42.843511450381676, "w": 11.29611545138889, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-06.png", "caption": "Run the first search across Greenhouse job boards and Adzuna", "typed": null, "hotspot": {"l": 35.625, "t": 36.704834605597966, "w": 10.387369791666666, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-07.png", "caption": "New postings are scored against your content. Finish setup to see them", "typed": null, "hotspot": {"l": 76.12250434027777, "t": 60.128419211195926, "w": 9.64138454861111, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/first-run-setup-08.png", "caption": "The review queue: best matches first", "typed": null, "hotspot": null, "ratio": 1.83206106870229}], "video": "assets/first-run-setup.mp4"}, {"name": "Tailor & approve", "description": "Pick a job, let Rozgar tailor your resume and cover letter, and check every change.", "frames": [{"src": "assets/tailor-approve-01.png", "caption": "Pick a job from the review queue", "typed": null, "hotspot": {"l": 15.76388888888889, "t": 69.95765744274809, "w": 20.310872395833332, "h": 6.147622455470738}, "ratio": 1.83206106870229}, {"src": "assets/tailor-approve-02.png", "caption": "The match panel shows the skills you have and the ones you lack. Rozgar never adds missing skills", "typed": null, "hotspot": {"l": 62.12727864583333, "t": 42.4598441475827, "w": 13.032226562499998, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/tailor-approve-03.png", "caption": "The tailored resume, every line labelled against your master resume", "typed": null, "hotspot": {"l": 22.33452690972222, "t": 23.0081106870229, "w": 8.026258680555555, "h": 6.1446405852417305}, "ratio": 1.83206106870229}, {"src": "assets/tailor-approve-04.png", "caption": "Sentences the AI made up are removed, with the reason", "typed": null, "hotspot": {"l": 79.16666666666666, "t": 18.49554707379135, "w": 18.40277777777778, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/tailor-approve-05.png", "caption": "Approved. Any later edit clears the approval", "typed": null, "hotspot": null, "ratio": 1.83206106870229}], "video": "assets/tailor-approve.mp4"}, {"name": "Assisted apply", "description": "Rozgar fills the real application form and stops. You click Submit.", "frames": [{"src": "assets/assisted-apply-01.png", "caption": "Fill the application form in Rozgar\u2019s own browser window", "typed": null, "hotspot": {"l": 78.95833333333333, "t": 30.25405534351145, "w": 18.61111111111111, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/assisted-apply-02.png", "caption": "Rozgar reports what it filled and what it left for you", "typed": null, "hotspot": {"l": 77.77777777777779, "t": 28.836673027989825, "w": 20.97222222222222, "h": 71.16332697201018}, "ratio": 1.83206106870229}, {"src": "assets/assisted-apply-03.png", "caption": "Rozgar filled the form from your profile and attached the PDF (a local copy of the Greenhouse page)", "typed": null, "hotspot": {"l": 23.194444444444446, "t": 5.852417302798982, "w": 38.47222222222222, "h": 6.870229007633588}, "ratio": 1.83206106870229}, {"src": "assets/assisted-apply-04.png", "caption": "Rozgar never clicks Submit. You check the form and submit it yourself", "typed": null, "hotspot": {"l": 23.194444444444446, "t": 85.80430979643766, "w": 13.73263888888889, "h": 6.870229007633588}, "ratio": 1.83206106870229}, {"src": "assets/assisted-apply-05.png", "caption": "Rozgar saw the confirmation page and marked it Applied", "typed": null, "hotspot": {"l": 0.4166666666666667, "t": 13.486005089058525, "w": 12.708333333333332, "h": 5.852417302798982}, "ratio": 1.83206106870229}, {"src": "assets/assisted-apply-06.png", "caption": "Every application, also written to Tracker.xlsx with a status dropdown", "typed": null, "hotspot": null, "ratio": 1.83206106870229}], "video": "assets/assisted-apply.mp4"}, {"name": "Content & privacy", "description": "The facts Rozgar may use, and what happens before anything goes to a cloud AI.", "frames": [{"src": "assets/content-privacy-01.png", "caption": "Open your content pool", "typed": null, "hotspot": {"l": 0.4166666666666667, "t": 18.06615776081425, "w": 12.708333333333332, "h": 5.852417302798982}, "ratio": 1.83206106870229}, {"src": "assets/content-privacy-02.png", "caption": "Add projects from GitHub, your portfolio or notes. Tailoring picks only from here", "typed": null, "hotspot": {"l": 23.79177517361111, "t": 69.21815362595419, "w": 8.14670138888889, "h": 6.1446405852417305}, "ratio": 1.83206106870229}, {"src": "assets/content-privacy-03.png", "caption": "Lock an item to keep it word for word", "typed": null, "hotspot": {"l": 0.4166666666666667, "t": 27.2264631043257, "w": 12.708333333333332, "h": 5.852417302798982}, "ratio": 1.83206106870229}, {"src": "assets/content-privacy-04.png", "caption": "By default nothing leaves this computer", "typed": null, "hotspot": {"l": 14.86111111111111, "t": 27.85364980916031, "w": 1.9444444444444444, "h": 3.5623409669211195}, "ratio": 1.83206106870229}, {"src": "assets/content-privacy-05.png", "caption": "Switch resume tailoring to Claude and save", "typed": null, "hotspot": {"l": 67.75607638888889, "t": 93.62476145038168, "w": 10.438368055555555, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/content-privacy-06.png", "caption": "Cloud AI shows what is sent and what is removed first, then asks for Touch ID", "typed": null, "hotspot": {"l": 49.91048177083333, "t": 72.40776081424937, "w": 5.821940104166667, "h": 5.597964376590331}, "ratio": 1.83206106870229}, {"src": "assets/content-privacy-07.png", "caption": "Cancelled: nothing changed", "typed": null, "hotspot": null, "ratio": 1.83206106870229}], "video": "assets/content-privacy.mp4"}];
let f = 0, i = 0, showVideo = false;
const $ = id => document.getElementById(id);

function renderTabs() {
  $('tabs').innerHTML = '';
  FLOWS.forEach((fl, k) => {
    const b = document.createElement('button');
    b.role = 'tab'; b.textContent = fl.name; b.setAttribute('aria-selected', k === f);
    b.onclick = () => { f = k; i = 0; showVideo = false; render(); };
    $('tabs').appendChild(b);
  });
}

function render() {
  renderTabs();
  const fl = FLOWS[f], fr = fl.frames[i];
  $('desc').textContent = fl.description || '';
  const screen = $('screen');
  screen.innerHTML = '';
  // Reserve the frame's height up front so hotspots never sit over an empty, still-loading image.
  screen.style.aspectRatio = showVideo && fl.video ? '' : String(fr.ratio);
  $('video').hidden = !fl.video;
  $('video').textContent = showVideo ? 'Back to walkthrough' : 'Watch video';
  if (showVideo && fl.video) {
    const v = document.createElement('video');
    v.src = fl.video; v.controls = true; v.autoplay = true; v.muted = true; v.playsInline = true;
    screen.appendChild(v);
  } else {
    const img = new Image();
    img.src = fr.src; img.alt = fr.caption; img.draggable = false;
    img.onclick = () => flash();
    screen.appendChild(img);
    if (fr.hotspot && i < fl.frames.length - 1) {
      const h = document.createElement('button');
      h.className = 'hot'; h.setAttribute('aria-label', fr.caption);
      Object.assign(h.style, {left: fr.hotspot.l + '%', top: fr.hotspot.t + '%', width: fr.hotspot.w + '%', height: fr.hotspot.h + '%'});
      h.onclick = e => { e.stopPropagation(); go(1); };
      screen.appendChild(h);
    }
    // Preload the next frame so clicks feel instant.
    if (fl.frames[i + 1]) new Image().src = fl.frames[i + 1].src;
  }
  $('cap').innerHTML = '';
  const b = document.createElement('b'); b.textContent = fr.caption; $('cap').appendChild(b);
  if (fr.typed) { const t = document.createElement('span'); t.className = 'typed'; t.textContent = 'Types: ' + fr.typed; $('cap').appendChild(t); }
  $('count').textContent = (i + 1) + ' / ' + fl.frames.length;
  $('prev').disabled = i === 0 && f === 0;
  const last = i === fl.frames.length - 1;
  $('next').textContent = last ? (f < FLOWS.length - 1 ? 'Next flow' : 'Restart') : 'Next';
  $('dots').innerHTML = '';
  fl.frames.forEach((_, k) => {
    const d = document.createElement('span'); if (k === i) d.className = 'on';
    d.onclick = () => { i = k; showVideo = false; render(); };
    $('dots').appendChild(d);
  });
}

function go(step) {
  showVideo = false;
  const fl = FLOWS[f];
  i += step;
  if (i >= fl.frames.length) { f = (f + 1) % FLOWS.length; i = 0; }
  if (i < 0) { if (f > 0) { f--; i = FLOWS[f].frames.length - 1; } else i = 0; }
  render();
}

function flash() {
  const h = document.querySelector('.hot');
  if (!h) return go(1);
  h.classList.add('flash'); setTimeout(() => h.classList.remove('flash'), 400);
}

$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('video').onclick = () => { showVideo = !showVideo; render(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
});
render();
</script>
</body>
</html>
